<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toulouse : photos d'archives (AD31)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root {
    --ink: #17252e;
    --ink-soft: #55656f;
    --line: #d5dde1;
    --surface: #f2f5f6;
    --panel: #ffffff;
    --accent: #0f6b73;
    --accent-ink: #ffffff;
    --active: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e6eef1;
      --ink-soft: #9db0ba;
      --line: #2b3b44;
      --surface: #0f1a20;
      --panel: #16242c;
      --accent: #4fb7c0;
      --accent-ink: #0b1519;
      --active: #ff7b72;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--surface);
  }
  .app {
    display: grid;
    grid-template-columns: 400px 1fr;
    height: 100%;
  }
  aside {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
  }
  header { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 22px;
    line-height: 1.2;
    margin: 0 0 6px;
    font-weight: 700;
  }
  header p { margin: 0; font-size: 13px; color: var(--ink-soft); line-height: 1.45; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  button {
    font: inherit; font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ol.list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; }
  .row {
    display: grid;
    grid-template-columns: 34px 1fr;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .row:hover { background: var(--surface); }
  .row.on { background: var(--surface); box-shadow: inset 4px 0 0 var(--active); }
  .num {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
    font-weight: 700; font-size: 14px;
  }
  .row.on .num { background: var(--active); }
  .lieu { font-weight: 600; font-size: 14px; line-height: 1.35; }
  .meta { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; margin-top: 3px; }
  .coord { font-variant-numeric: tabular-nums; }
  #map { height: 100%; min-height: 0; }
  .pin {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    border: 2px solid #fff;
    display: grid; place-items: center;
    font: 700 13px/1 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    box-shadow: 0 1px 4px rgba(0,0,0,.45);
  }
  .pin.on { background: var(--active); width: 34px; height: 34px; font-size: 15px; }
  .leaflet-popup-content { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13px; line-height: 1.5; margin: 12px 14px; }
  .leaflet-popup-content strong { font-size: 14px; }
  .leaflet-popup-content .pm { color: #55656f; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 55vh 45vh; }
    #map { order: -1; }
    aside { border-right: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>Toulouse : photos d'archives</h1>
      <p>Inventaire des prises de vue localisées. Sélectionne un lieu pour le retrouver sur la carte.</p>
    </header>
    <div class="tools">
      <button class="primary" id="btn-all" type="button">Voir l'ensemble</button>
      <button id="btn-csv" type="button">Exporter CSV</button>
      <button id="btn-geo" type="button">Exporter GeoJSON</button>
    </div>
    <ol class="list" id="list"></ol>
  </aside>
  <div id="map" role="region" aria-label="Carte des points"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
// ---------------------------------------------------------------
// REGISTRE DES POINTS : pour ajouter un point, copier une ligne
// en fin de tableau. La carte et la liste se mettent à jour seules.
// ---------------------------------------------------------------
const POINTS = [
  { n: 1, cote: "26 FI 31555 NEG 4098", source: "AD31", date: "1900-1920",
    lieu: "Rue d'Alsace-Lorraine, angle rue Lafayette, Zara (ex « Au Gaspillage »)",
    lat: 43.60479804, lon: 1.4459232, note: "Immeuble de l'ancien Bazar Labit." },
  { n: 2, cote: "26 FI 31555 1548, n° 154", source: "Labouche frères", date: "1909-1925, cachet 1914",
    lieu: "Colonne Dupuy, rue du Faubourg Saint-Étienne",
    lat: 43.60055359, lon: 1.45241867, note: "" },
  { n: 3, cote: "26 FI 31555 196, n° 150", source: "Labouche frères", date: "1911, cachet 1916 ou 1918",
    lieu: "Rue Lafayette et square du Donjon",
    lat: 43.60512456, lon: 1.44469002, note: "" },
  { n: 4, cote: "26 FI 31555 187, n° 130", source: "Labouche frères", date: "vers 1905",
    lieu: "Entrée du boulevard de Strasbourg",
    lat: 43.60849924, lon: 1.445615, note: "" },
  { n: 5, cote: "26 FI 31555 176, n° 119", source: "Labouche frères", date: "[1909]",
    lieu: "Place et square Lafayette",
    lat: 43.60467519, lon: 1.44670621, note: "Actuelle place Wilson. Coordonnées du photographe fournies par l'utilisateur." },
  { n: 6, cote: "26 FI 31555 59, n° 20 bis", source: "Labouche frères", date: "[1909]",
    lieu: "Rue d'Alsace-Lorraine et square du Capitole",
    lat: 43.60480556, lon: 1.44569444, note: "Vue vers le sud." },
  { n: 7, cote: "26 FI 31555 TP 3002, n° 20", source: "Maison Labouche frères", date: "[1920-1950]",
    lieu: "Rue d'Alsace-Lorraine et square du Capitole (vue en hauteur)",
    lat: 43.60496981, lon: 1.4458877, note: "Vue vers le nord ; Bazar Labit à droite." },
  { n: 8, cote: "26 FI 31555 TP 3003, n° 20", source: "Maison Labouche frères", date: "[1920-1950]",
    lieu: "Rue d'Alsace-Lorraine (vue en hauteur)",
    lat: 43.60515201, lon: 1.44579705, note: "Vue vers le sud ; tour du Bazar Labit au fond (hypothèse)." }
];

const fr = (x) => String(x).replace(".", ",");
const map = L.map("map", { zoomControl: true });
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

const markers = {};
const rows = {};
let current = null;
const list = document.getElementById("list");

function popupHtml(p) {
  const d = document.createElement("div");
  const s = document.createElement("strong");
  s.textContent = p.n + ". " + p.lieu;
  d.appendChild(s);
  const add = (txt, cls) => {
    const e = document.createElement("div");
    if (cls) e.className = cls;
    e.textContent = txt;
    d.appendChild(e);
  };
  add(p.cote + " (" + p.source + ")", "pm");
  add("Date : " + p.date, "pm");
  add(fr(p.lat.toFixed(6)) + " ; " + fr(p.lon.toFixed(6)), "pm");
  if (p.note) add(p.note, "pm");
  return d;
}

function icon(n, on) {
  return L.divIcon({
    className: "",
    html: '<div class="pin' + (on ? " on" : "") + '">' + n + "</div>",
    iconSize: on ? [34, 34] : [28, 28],
    iconAnchor: on ? [17, 17] : [14, 14]
  });
}

function select(n, fly) {
  if (current !== null) {
    markers[current].setIcon(icon(current, false));
    rows[current].classList.remove("on");
  }
  current = n;
  markers[n].setIcon(icon(n, true));
  markers[n].setZIndexOffset(1000);
  rows[n].classList.add("on");
  if (fly) {
    const p = POINTS.find((q) => q.n === n);
    map.flyTo([p.lat, p.lon], 18, { duration: 0.8 });
  }
  markers[n].openPopup();
}

POINTS.forEach((p) => {
  const m = L.marker([p.lat, p.lon], { icon: icon(p.n, false), title: p.lieu }).addTo(map);
  m.bindPopup(popupHtml(p));
  m.on("click", () => select(p.n, false));
  markers[p.n] = m;

  const li = document.createElement("li");
  li.className = "row";
  li.tabIndex = 0;
  const num = document.createElement("div");
  num.className = "num";
  num.textContent = p.n;
  const body = document.createElement("div");
  const lieu = document.createElement("div");
  lieu.className = "lieu";
  lieu.textContent = p.lieu;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = p.cote + " · " + p.source + " · " + p.date;
  const coord = document.createElement("div");
  coord.className = "meta coord";
  coord.textContent = fr(p.lat.toFixed(6)) + " ; " + fr(p.lon.toFixed(6));
  body.append(lieu, meta, coord);
  li.append(num, body);
  li.addEventListener("click", () => select(p.n, true));
  li.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(p.n, true); }
  });
  list.appendChild(li);
  rows[p.n] = li;
});

function fitAll() {
  map.closePopup();
  map.fitBounds(L.latLngBounds(POINTS.map((p) => [p.lat, p.lon])), { padding: [50, 50] });
}
fitAll();
document.getElementById("btn-all").addEventListener("click", fitAll);

function download(name, mime, text) {
  const blob = new Blob([text], { type: mime });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.getElementById("btn-csv").addEventListener("click", () => {
  const q = (s) => '"' + String(s).replace(/"/g, '""') + '"';
  const head = ["N°", "Photo d'archive", "Source", "Date", "Lieu", "Latitude", "Longitude", "Remarques"];
  const lines = [head.map(q).join(";")].concat(
    POINTS.map((p) => [p.n, q(p.cote), q(p.source), q(p.date), q(p.lieu), fr(p.lat), fr(p.lon), q(p.note)].join(";"))
  );
  download("inventaire_toulouse_archives.csv", "text/csv;charset=utf-8", "\ufeff" + lines.join("\r\n"));
});

document.getElementById("btn-geo").addEventListener("click", () => {
  const gj = {
    type: "FeatureCollection",
    features: POINTS.map((p) => ({
      type: "Feature",
      geometry: { type: "Point", coordinates: [p.lon, p.lat] },
      properties: { n: p.n, cote: p.cote, source: p.source, date: p.date, lieu: p.lieu, note: p.note }
    }))
  };
  download("toulouse_archives.geojson", "application/geo+json", JSON.stringify(gj, null, 2));
});
</script>
</body>
</html>
